name: build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Test
        run: python -m pytest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: ZeroCell.exe
          - os: ubuntu-latest
            binary: zerocell-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build binary
        run: pyinstaller --onefile --windowed --collect-all customtkinter --paths src --name zerocell src/main.py
      - name: Rename binary
        shell: bash
        run: |
          mv dist/zerocell${{ matrix.os == 'windows-latest' && '.exe' || '' }} "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
      - name: Upload release asset
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.binary }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}